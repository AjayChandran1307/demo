
trigger:
- Master

pool:
  vmImage: ubuntu-latest

steps:
- task: KubernetesManifest@1
  inputs:
    action: 'deploy'
    connectionType: 'azureResourceManager'
    azureSubscriptionConnection: 'devcops-sr'
    azureResourceGroup: '3006'
    kubernetesCluster: 'aks'
    namespace: 'default'
    manifests: 'Master'